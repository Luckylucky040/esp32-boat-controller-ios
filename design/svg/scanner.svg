<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="390" height="844" fill="#0B1220"/>
  <!-- Nav bar -->
  <text x="16" y="80" fill="#F5F7FA" font-size="28" font-weight="700">Connect to Boat</text>
  <circle cx="358" cy="72" r="16" fill="#16223A"/>
  <text x="358" y="77" fill="#A6B0C3" font-size="14" text-anchor="middle">⚙</text>

  <!-- Status pill -->
  <rect x="16" y="100" width="120" height="28" rx="14" fill="#7C8AA5" opacity="0.15"/>
  <circle cx="30" cy="114" r="5" fill="#7C8AA5"/>
  <text x="42" y="118" fill="#7C8AA5" font-size="13" font-weight="600">Disconnected</text>

  <!-- Section header -->
  <text x="16" y="160" fill="#A6B0C3" font-size="12" letter-spacing="1">NEARBY DEVICES</text>

  <!-- Card -->
  <rect x="16" y="172" width="358" height="260" rx="20" fill="#16223A"/>

  <!-- Row 1 -->
  <circle cx="48" cy="212" r="16" fill="#2E8BFF" opacity="0.12"/>
  <text x="48" y="217" fill="#2E8BFF" font-size="12" text-anchor="middle">BLE</text>
  <text x="76" y="208" fill="#F5F7FA" font-size="16" font-weight="600">ESP32-Boat</text>
  <text x="76" y="224" fill="#A6B0C3" font-size="12">4F3E-...-C2A1</text>
  <text x="358" y="216" fill="#A6B0C3" font-size="13" text-anchor="end" font-family="monospace">-52 dBm</text>
  <line x1="32" y1="244" x2="358" y2="244" stroke="#22304D" stroke-width="1"/>

  <!-- Row 2 -->
  <circle cx="48" cy="276" r="16" fill="#2E8BFF" opacity="0.12"/>
  <text x="48" y="281" fill="#2E8BFF" font-size="12" text-anchor="middle">BLE</text>
  <text x="76" y="272" fill="#F5F7FA" font-size="16" font-weight="600">Unnamed device</text>
  <text x="76" y="288" fill="#A6B0C3" font-size="12">9A11-...-77B0</text>
  <text x="358" y="280" fill="#A6B0C3" font-size="13" text-anchor="end" font-family="monospace">-81 dBm</text>
  <line x1="32" y1="308" x2="358" y2="308" stroke="#22304D" stroke-width="1"/>

  <!-- Row 3 skeleton -->
  <rect x="76" y="330" width="140" height="12" rx="6" fill="#22304D"/>
  <rect x="76" y="348" width="90" height="10" rx="5" fill="#22304D"/>

  <!-- Rescan button -->
  <rect x="16" y="760" width="358" height="50" rx="14" fill="none" stroke="#33456B" stroke-width="1"/>
  <text x="195" y="791" fill="#F5F7FA" font-size="17" font-weight="600" text-anchor="middle">Rescan</text>
</svg>
