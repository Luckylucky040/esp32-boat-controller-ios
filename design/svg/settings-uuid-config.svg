<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="390" height="844" fill="#0B1220" opacity="0.3"/>
  <!-- sheet -->
  <rect x="0" y="140" width="390" height="704" rx="20" fill="#111A2E"/>
  <rect x="177" y="156" width="36" height="5" rx="2.5" fill="#33456B"/>

  <text x="24" y="200" fill="#F5F7FA" font-size="22" font-weight="700">BLE Configuration</text>
