  <text x="24" y="238" fill="#A6B0C3" font-size="12" letter-spacing="1">SERVICE</text>
  <text x="24" y="260" fill="#A6B0C3" font-size="13">Service UUID</text>
  <rect x="24" y="266" width="342" height="44" rx="8" fill="#16223A" stroke="#22304D" stroke-width="1"/>
  <text x="34" y="293" fill="#F5F7FA" font-size="14" font-family="monospace">6E400001-B5A3-F393-E0A9-E50E24DCCA9E</text>

  <text x="24" y="342" fill="#A6B0C3" font-size="12" letter-spacing="1">CHARACTERISTICS</text>
  <text x="24" y="364" fill="#A6B0C3" font-size="13">Command Characteristic UUID</text>
  <rect x="24" y="370" width="342" height="44" rx="8" fill="#16223A" stroke="#22304D" stroke-width="1"/>
  <text x="34" y="397" fill="#F5F7FA" font-size="14" font-family="monospace">6E400002-B5A3-F393-E0A9-E50E24DCCA9E</text>

  <text x="24" y="446" fill="#A6B0C3" font-size="13">Position Characteristic UUID</text>
  <rect x="24" y="452" width="342" height="44" rx="8" fill="#16223A" stroke="#22304D" stroke-width="1"/>
  <text x="34" y="479" fill="#F5F7FA" font-size="14" font-family="monospace">6E400003-B5A3-F393-E0A9-E50E24DCCA9E</text>

