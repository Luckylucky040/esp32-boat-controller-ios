<svg width="390" height="844" viewBox="0 0 390 844" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="390" height="844" fill="#0B1220"/>
  <!-- Nav bar -->
  <text x="16" y="80" fill="#F5F7FA" font-size="22" font-weight="700">Boat Control</text>
  <rect x="270" y="64" width="88" height="24" rx="12" fill="#2ED573" opacity="0.15"/>
  <circle cx="284" cy="76" r="4" fill="#2ED573"/>
  <text x="295" y="80" fill="#2ED573" font-size="11" font-weight="600">Connected</text>
  <circle cx="358" cy="76" r="14" fill="#16223A"/>
  <text x="358" y="80" fill="#A6B0C3" font-size="12" text-anchor="middle">⚙</text>

  <!-- Boat view -->
  <g transform="translate(195,280)">
    <circle r="130" fill="#111A2E"/>
    <!-- hull, bow up -->
    <polygon points="0,-90 34,20 22,70 -22,70 -34,20" fill="#A6B0C3" opacity="0.85"/>
    <!-- rudder, centered (no rotation) -->
    <rect x="-6" y="70" width="12" height="34" rx="3" fill="#7C8AA5"/>
    <!-- wake lines -->
    <path d="M -40 100 Q -20 115 -40 130" stroke="#22304D" stroke-width="2" fill="none"/>
    <path d="M 40 100 Q 20 115 40 130" stroke="#22304D" stroke-width="2" fill="none"/>
  </g>

  <!-- Telemetry row -->
  <text x="150" y="452" fill="#F5F7FA" font-size="20" font-weight="500" text-anchor="middle" font-family="monospace">0°</text>
  <line x1="195" y1="436" x2="195" y2="456" stroke="#22304D" stroke-width="1"/>
  <text x="240" y="452" fill="#A6B0C3" font-size="15" text-anchor="start" font-family="monospace">-58 dBm</text>

  <!-- Steering hold areas -->
  <rect x="0" y="624" width="195" height="220" fill="#16223A"/>
  <rect x="195" y="624" width="195" height="220" fill="#16223A"/>
  <line x1="195" y1="624" x2="195" y2="844" stroke="#22304D" stroke-width="1"/>

  <text x="97" y="730" fill="#2E8BFF" font-size="32" text-anchor="middle">◀</text>
  <text x="97" y="760" fill="#A6B0C3" font-size="12" letter-spacing="1" text-anchor="middle">LEFT</text>

  <text x="292" y="730" fill="#00D1B2" font-size="32" text-anchor="middle">▶</text>
  <text x="292" y="760" fill="#A6B0C3" font-size="12" letter-spacing="1" text-anchor="middle">RIGHT</text>
</svg>
