name: iOS Build

"on":
  push:
    branches: [main, master, copilot/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build BoatController
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show build environment
        run: |
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project BoatController.xcodeproj \
            -scheme BoatController \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          retention-days: 14
