name: iOS Build

"on":
  push:
    branches: [main, master, copilot/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build BoatController
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show build environment
        run: |
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -o pipefail
          # Build for a generic iOS *device* (not the simulator). The runner's
          # simulator runtimes don't match the Xcode 16.2 SDK build version,
          # which makes actool fail on the asset catalog with
          # "No simulator runtime version ... available". A device build with
          # signing disabled compiles + links all Swift and compiles the asset
          # catalog without needing a simulator runtime.
          xcodebuild build \
            -project BoatController.xcodeproj \
            -scheme BoatController \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log
          retention-days: 14
